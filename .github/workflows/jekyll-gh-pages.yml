name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]      # เปลี่ยนเป็นชื่อ branch ของคุณถ้าไม่ใช่ main
  workflow_dispatch:       # กด Run เองได้จากแท็บ Actions

permissions:
  contents: read
  pages: write
  id-token: write

# ให้ deploy ทีละครั้ง ไม่ยกเลิกตัวที่กำลังรัน (กันปัญหา "Canceling deployment")
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # เก็บเฉพาะไฟล์ที่ต้องเสิร์ฟจริง → artifact เล็ก, ไม่รวม backend (index.ts, schema.sql)
      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html _site/
          [ -f manual-project-role.html ] && cp manual-project-role.html _site/ || true
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
